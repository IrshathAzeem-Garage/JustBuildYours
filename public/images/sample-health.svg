<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#F4F2EC"/>
  <!-- Device mockup container -->
  <rect x="180" y="30" width="440" height="440" rx="28" fill="#FFFFFF" stroke="#E5E3DE" stroke-width="2"/>
  <!-- Status bar -->
  <circle cx="400" cy="50" r="4" fill="#D6D3CC"/>
  <rect x="230" y="80" width="180" height="20" rx="4" fill="#111111"/>
  <text x="230" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="700" fill="#111111">7h 48m</text>
  <text x="230" y="145" font-family="Inter, sans-serif" font-size="12" fill="#6B6B6B">Optimal Sleep Duration</text>
  <!-- Chart visual -->
  <path d="M220 220 C280 160, 340 250, 400 180 C460 120, 520 210, 580 160" stroke="#111111" stroke-width="3" fill="none"/>
  <circle cx="400" cy="180" r="6" fill="#111111"/>
  <circle cx="580" cy="160" r="6" fill="#111111"/>
  <!-- Metric Cards -->
  <rect x="220" y="270" width="165" height="80" rx="8" fill="#F7F6F2" stroke="#E5E3DE"/>
  <text x="240" y="300" font-family="Inter, sans-serif" font-size="11" fill="#6B6B6B">Recovery Score</text>
  <text x="240" y="332" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" fill="#111111">94%</text>
  
  <rect x="415" y="270" width="165" height="80" rx="8" fill="#F7F6F2" stroke="#E5E3DE"/>
  <text x="435" y="300" font-family="Inter, sans-serif" font-size="11" fill="#6B6B6B">HRV Baseline</text>
  <text x="435" y="332" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" fill="#111111">68 ms</text>
  <!-- Bottom nav -->
  <rect x="220" y="380" width="360" height="50" rx="25" fill="#111111"/>
  <text x="400" y="411" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Log Evening Routine</text>
</svg>
